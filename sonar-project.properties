# Configuration SonarQube — analyse locale reproductible.
#   bash test/run-all.sh                       (tests)
#   npm run test:coverage                      (tests + coverage/lcov.info)
#   docker run --rm --network host -v "$PWD":/usr/src -w /usr/src \
#     -e SONAR_TOKEN=... -e SONAR_HOST_URL=http://localhost:9000 \
#     sonarsource/sonar-scanner-cli
sonar.projectKey=github-companion
sonar.projectName=GitHub Companion
sonar.sourceEncoding=UTF-8

# Source = extension (TypeScript) + panneau webview (JS/CSS/HTML).
sonar.sources=src,media
# Les tests ne sont pas du code livré : hors couverture, mais analysés.
sonar.tests=test
sonar.test.inclusions=test/**/*.js
sonar.typescript.tsconfigPaths=tsconfig.json

# Rapport de couverture produit par c8 (voir test/run-all.sh).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=node_modules/**,out/**,coverage/**,resources/**,.vscode/**,*.lock,package-lock.json
